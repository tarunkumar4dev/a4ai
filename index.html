<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>a4ai — India's Smartest Test & Contest Platform for Students & Teachers</title>
    <meta
      name="description"
      content="a4ai is India's next-gen AI EdTech platform for students and teachers — generate smart test papers, host proctored contests, and view analytics."
    />
    <meta
      name="keywords"
      content="a4ai, AI for All India, AI test generator, contest platform, CBSE, ICSE, entrance, education AI, test papers, online exams"
    />
    <meta name="author" content="Tarun Pathak" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://a4ai.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="a4ai — Smart Test & Contest Platform" />
    <meta
      property="og:description"
      content="Create, compete, and learn with AI — India's EdTech revolution."
    />
    <meta property="og:url" content="https://a4ai.in/" />
    <meta property="og:image" content="https://a4ai.in/bg.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="a4ai — Smart Test & Contest Platform" />
    <meta
      name="twitter:description"
      content="Create, compete, and learn with AI — India's EdTech revolution."
    />
    <meta name="twitter:image" content="https://a4ai.in/bg.jpg" />

    <!-- Nice to have -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/ICON.ico" />

    <!-- Main UI font (self-hosted, see src/index.css) -->
    <link rel="preload" href="/fonts/PlusJakartaSans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Razorpay prefetch (loaded on demand by PaymentPage) -->
    <link rel="dns-prefetch" href="https://checkout.razorpay.com" />

    <!-- Google Analytics -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZWBNL12SRZ');
      // gtag.js (~180 KB) is fetched after the page has loaded so it doesn't compete with the app on slow
      // connections; events queued in dataLayer before that are still sent.
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZWBNL12SRZ';
        document.head.appendChild(s);
      });
    </script>

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "a4ai",
        "url": "https://a4ai.in",
        "logo": "https://a4ai.in/LOGO.png",
        "description": "AI-powered education platform for students, teachers, and institutes in India.",
        "founder": {
          "@type": "Person",
          "name": "Tarun Pathak"
        },
        "sameAs": [
          "https://www.youtube.com/@a4ai_Official",
          "https://x.com/a4aiOfficial"
        ]
      }
    </script>

    <!-- WebSite JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://a4ai.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://a4ai.in/search?q={query}",
          "query-input": "required name=query"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
